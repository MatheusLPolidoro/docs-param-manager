[project]
name = "docs-param-manager"
version = "0.1.0"
description = "Documentação central do produto Param Manager."
authors = [{name = "MatheusLPolidoro", email = "mattpolidoro4@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 79
# extend-exclude (e não exclude) para preservar a lista padrão do ruff,
# que já ignora .venv/, dist/, build/ e afins.
extend-exclude = ["docs/*", "chanlogs.d/*"]

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.taskipy.tasks]
fix = "ruff check . --fix"
lint = "ruff check ."
format = "ruff format ."
docs = "mkdocs serve"
build = "mkdocs build --strict"

[tool.towncrier]
# Sem `package`: este repositório não distribui código, então a versão
# vive aqui e não em um __init__.py.
name = "docs-param-manager"
version = "0.1.0"
filename = "CHANGELOG.md"
directory = "chanlogs.d"
underlines = ["=", "-", "~"]
title_format = "Versão {version} ({project_date})"
issue_format = "[#{issue}](http://gitlab.127.0.0.1.nip.io/matheuslpolidoro/docs-param-manager/-/issues/{issue})"

# Mesmo vocabulário do param-manager. O fast-param-manager usa outro
# (feature/bugfix/doc/removal/misc) — conferir antes de nomear fragmento.
[[tool.towncrier.type]]
directory = "breaking"
name = ":warning: MUDANÇAS QUEBRADAS"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = ":zap: NOVAS FUNCIONALIDADES"
showcontent = true

[[tool.towncrier.type]]
directory = "enhancement"
name = ":rocket: OTIMIZAÇÕES"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = ":bug: CORREÇÕES"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecation"
name = ":wastebasket: OBSOLETOS"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = ":shield: SEGURANÇA"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = ":open_file_folder: DOCUMENTAÇÃO"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = ":test_tube: TESTES"
showcontent = true

[[tool.towncrier.type]]
directory = "infra"
name = ":classical_building: INFRAESTRUTURA"
showcontent = true

[[tool.towncrier.type]]
directory = "chore"
name = ":broom: LIMPEZA"
showcontent = true

<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Param Manager">
  <!--
    Marca do Param Manager sobre placa roxa.

    O logo.svg original é branco sobre transparente: nasceu para a barra
    escura do tema e some em qualquer fundo claro — inclusive na aba do
    navegador. Esta variante traz a placa junto, então funciona como
    favicon, no herói da página inicial e em fundo claro ou escuro.
  -->
  <rect width="320" height="320" rx="64" fill="#5e35b1"/>
  <g transform="translate(160 160) scale(0.82) translate(-160 -160)">
    <line x1="70" y1="220" x2="80" y2="240" stroke="#fff" stroke-width="10" stroke-linecap="round" />
    <line x1="250" y1="220" x2="240" y2="240" stroke="#fff" stroke-width="10" stroke-linecap="round" />
    <line x1="130" y1="270" x2="190" y2="270" stroke="#fff" stroke-width="10" stroke-linecap="round" />

    <line x1="140" y1="130" x2="85" y2="180" stroke="#fff" stroke-width="10" stroke-linecap="round" />
    <line x1="180" y1="130" x2="235" y2="180" stroke="#fff" stroke-width="10" stroke-linecap="round" />

    <line x1="130" y1="50" x2="190" y2="50" stroke="#fff" stroke-width="10" stroke-linecap="round" />
    <line x1="90" y1="80" x2="70" y2="160" stroke="#fff" stroke-width="10" stroke-linecap="round" />
    <line x1="230" y1="80" x2="250" y2="160" stroke="#fff" stroke-width="10" stroke-linecap="round" />

    <line x1="120" y1="80" x2="140" y2="100" stroke="#fff" stroke-width="10" stroke-linecap="round" />
    <line x1="200" y1="80" x2="180" y2="100" stroke="#fff" stroke-width="10" stroke-linecap="round" />

    <circle cx="60" cy="190" r="26" fill="#fff" stroke="#fff" stroke-width="10" />
    <circle cx="260" cy="190" r="26" fill="#fff" stroke="#fff" stroke-width="10" />
    <circle cx="100" cy="270" r="30" fill="#fff" stroke="#fff" stroke-width="10" />
    <circle cx="220" cy="270" r="30" fill="#fff" stroke="#fff" stroke-width="10" />

    <circle cx="160" cy="115" r="20" fill="#fff" stroke="#fff" stroke-width="10" />

    <circle cx="100" cy="50" r="30" fill="#fff" stroke="#fff" stroke-width="10" />
    <circle cx="220" cy="50" r="30" fill="#fff" stroke="#fff" stroke-width="10" />
  </g>
</svg>
